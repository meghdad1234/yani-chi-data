name: fetch-kaikki
on:
  schedule:
    - cron: '0 3 1 * *'   # اول هر ماه
  workflow_dispatch:      # اجرای دستی از تب Actions
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch_kaikki.mjs
      - run: |
          git config user.name "yani-chi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: update fa dump" && git push)
